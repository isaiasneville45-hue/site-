# Temporário: baixa as fotos selecionadas do Pexels (licença Pexels) para o repositório.
# Será removido assim que as imagens forem otimizadas e incorporadas ao site.
name: Fetch stock photos

on:
  push:
    branches:
      - ccr-6a0c67a2-xkha3q
    paths:
      - .github/workflows/fetch-photos.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos
        run: |
          mkdir -p _incoming
          for id in 5069612 8076181 27522843 5997975 263201 6621357 7088494 4046561 12115041 14438367 3985311 7582560 7582568 4586739 3985329; do
            curl -fsSL --retry 3 -o "_incoming/$id.jpg" \
              "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=2000"
          done
          ls -la _incoming
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add _incoming
          git commit -m "Add downloaded stock photos for optimization"
          git push
