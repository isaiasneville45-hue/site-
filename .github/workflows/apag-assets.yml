# TEMPORÁRIO — baixa conteúdo e imagens para a seção de Produtos do site da APAG.
# O ambiente de desenvolvimento não acessa os sites dos fornecedores, então este
# job (que tem internet) roda os scripts de apag/scripts/assets e devolve o
# resultado como commit na própria branch. Será removido ao fim do trabalho.
name: APAG assets (temporário)

on:
  push:
    branches:
      - claude/focused-gauss-c03r4b
    paths:
      - apag/scripts/assets/RUN

permissions:
  contents: write

concurrency:
  group: apag-assets
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils webp >/dev/null
          python3 -m pip install --quiet --break-system-packages pillow

      - name: Executar
        run: |
          read -r MODE ARGS < apag/scripts/assets/RUN
          echo "modo: $MODE $ARGS"
          case "$MODE" in
            discover) python3 apag/scripts/assets/discover.py $ARGS ;;
            download) python3 apag/scripts/assets/download.py $ARGS ;;
            *) echo "modo desconhecido: $MODE"; exit 1 ;;
          esac
          echo "MODE=$MODE" >> "$GITHUB_ENV"

      - name: Commit do resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apag/scripts/assets/research apag/public/produtos apag/public/fotos 2>/dev/null || true
          if git diff --cached --quiet; then echo "nada para commitar"; exit 0; fi
          git commit -q -m "chore(assets): resultado da execução ($MODE)"
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
