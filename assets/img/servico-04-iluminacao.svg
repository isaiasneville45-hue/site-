<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 175" role="img" aria-label="Ilustração de bloco autônomo de iluminação de emergência instalado na parede">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2b2b"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="beam" cx="50%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#fff6d8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="housing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f4"/>
      <stop offset="100%" stop-color="#c9c9c9"/>
    </linearGradient>
  </defs>

  <rect width="300" height="175" fill="url(#bg)"/>

  <!-- light beams -->
  <path d="M118 62 L60 175 L176 175 Z" fill="url(#beam)"/>
  <path d="M182 62 L124 175 L240 175 Z" fill="url(#beam)"/>

  <!-- wall bracket -->
  <rect x="128" y="46" width="44" height="10" rx="2" fill="#3a3a3a"/>

  <!-- housing -->
  <rect x="100" y="52" width="100" height="34" rx="4" fill="url(#housing)"/>
  <rect x="100" y="52" width="100" height="34" rx="4" fill="none" stroke="#9a9a9a" stroke-width="1"/>

  <!-- lamp heads -->
  <circle cx="122" cy="69" r="13" fill="#1a1a1a"/>
  <circle cx="122" cy="69" r="9" fill="#fff6d8"/>
  <circle cx="178" cy="69" r="13" fill="#1a1a1a"/>
  <circle cx="178" cy="69" r="9" fill="#fff6d8"/>

  <!-- brand strip -->
  <rect x="112" y="82" width="76" height="3" rx="1.5" fill="#8a8a8a"/>

  <!-- status LED -->
  <circle cx="192" cy="59" r="2.6" fill="#D8232A"/>
</svg>
